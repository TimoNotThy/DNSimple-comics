# Home page
home:
  title: "How HTTPS Works"
  certificat_cta: "Start reading"
  subtitle: "How HTTPS works ...in a comic!"
  p1: "Have you ever wondered why a lock icon appears on your browser URL bar? And why is it important? We did too, and this comic is for you!"
  p2: "Follow the adventures of Certificat, Browserbird, and Compugter as they explain why HTTPS is crucial for the future of the web and how it all works together."
  p3: "Don't let the bad crabs get you (you'll know what we mean in the comic). Get to know HTTPS and why it is essential to your privacy."
  small_cta: "Start reading now"

# Episode fragments for /episodes
fragment:
  ep1: "Start reading here. If there is only one thing that you take away from this comic, let it be this one."
  ep2: "To understand how HTTPS works, you have to know how symmetric and asymmetric key encryption works. It sounds like big words, but really it's not."
  ep3: "When you browse to a HTTP secure site, your browser and the server where it connects to have a secret handshake. We break this down and bring it into the real world so you can greet your friends with the secret handshake."
  ep4: "It's easy to confuse HTTPS, SSL, and TLS. We often use these terms interchangeably. Let's talk about each of them with a bit of hiss-tory."
  ep5: "What do they do? Why do we need them? How do they validate certificates? So many questions to answer in this last chapter of the comic!"

# Episodes
ep1:
  s1: "Why do we need HTTPS?"
  s2: "We need HTTPS for 3 reasons."
  s3: "Privacy, integrity, and identification."
  s4: "Let's talk about privacy first."
  s5: "I'll use my friends as an example."
  s6: "no text"
  s7: "I am sending a message to Browserbird."
  s8: "Oh no! The message is not encrypted!"
  s9: "Crab is listening on the communication capturing the message."
  s10: "Potentially using it for evil."
  s11: "Privacy means that no one can eavesdrop on your messages."
  s12: "Bad crab. Bad."
  s13: "When you browse to a website without HTTPS, I could be eavesdropping on your password."
  s14: "The padlock on the URL bar of your browser tells you that there are no crabs watching over your shoulder."
  s15: "Reason number 2: integrity."
  s16: "Example coming up!"
  s17: "I am sending another message to Browserbird unencrypted."
  s18: "But before it reaches Browserbird, I intercept the message."
  s19: "I update the message to say bad things about Browserbird and forward it to him."
  s20: "Why would Compugter say such things about me?"
  s21: "no text"
  s22: "This is often called a man-in-the-middle attack."
  s23: "And crab-in-the-middle attacks are the worst."
  s24: "Bad Crab. Bad."
  s25: "Integrity means that the message is not manipulated on the way to its destination."
  s26: "I make sure that your communication is not being tampered with."
  s27: "Reason number 3: identification."
  s28: "Example time!"
  s29: "Identification means that I can check that this message is coming from Compugter."
  s30: "A digital signature attached to a message can identify the sender."
  s31: "The digital signature is not the closing text on your emails. Anyone could copy that ;)"
  s32: "And when you are browsing the web, identification means that the site that you are visiting is indeed the one you think it is."
  s33: "HTTPS, via SSL certificates, ensures you are connected exactly with the receiver you would expect."
  s34: "This SSL certificate is valid and has been issued by a legitimate Certificate Authority. You are good to go."
  s35: "We'll be talking more about SSL certificates and Certificate Authorities soon, so stay tuned."
  s36: "In summary, privacy, integrity and identification are the main reasons why HTTPS is important."
  next: "Next on HowHTTPS.works..."
  next_teaser: "Now that we know the why, the next step is to understand symmetric and asymmetric encryption. Big words, but easy concepts."

ep2:
  s1: "The Keys"
  s2: "HTTPS needs a way to provide privacy, integrity, and identification on the web."
  s3: "And that mechanism is called 'encryption'."
  s4-1: "Let's talk about the two types of encryption algorithms."
  s4-2: "Now, where did I put those keys?"
  s5-1: "Finally!"
  s5-2: "Let's start with the symmetric key algorithm."
  s6: "In this scenario, there is only one key to encrypt and decrypt a message."
  s7: "Before sending a message to BrowserBird, I encrypt the message with a key."
  s8: "You can think of the encryption process like putting the message in a box and locking the box with a key."
  s9: "Only the person that has a copy of the key can open the box and read the message."
  s10: "This guarantees that the box cannot be opened until it reaches the person with the right key."
  s11: "When Browserbird gets the box, they use their key to open it and read the message."
  s12: "It's important that the key is kept private. You should not share the key in plain text, or send it with the box. Or keep it in your pocket."
  s13: "Remember, anyone with the key can open the box."
  s14-1: "Using the box is a nice visual to understand encryption, but it's really oversimplifying it."
  s14-2: "Let's fix that!"
  s15: "In reality, anyone looking at the message without the key only sees nonsense text."
  s16: "This text was generated by an encryption algorithm."
  s17: "Which is a fancy way to say that the text was scrambled through a series of steps."
  s18: "It was transformed and spread out multiple times. Each time obfuscating the message further."
  s19: "To decrypt a message, we just need to apply the same steps, but in reverse order."
  s20: "The encryption key is mixed in with the message, so even if you know the encryption algorithm, without the key, the message is still nonsense."
  s21: "Here is what a key might look like."
  s22: "One main issue with symmetric keys is that they are hard to share."
  s23: "You have to be super careful with how you distribute the key."
  s24: "This brings us to asymmetric keys."
  s25: "With asymmetric keys, you have 2 keys."
  s26: "One key is public, the other one is private. They are paired and work together."
  s27-1: "Share your public key with anyone. Send it in plain text, make stickers, tattoos. Anything you want! It's public!"
  s27-2: "I like tattoos."
  s28: "Compugter is sending their public key to BrowserBird."
  s29: "And now I am sending a message back to them encrypting it with their public key."
  s30: "In other words, BrowserBird puts the message in a box and locks it with Compugter's public key."
  s31: "I can now use my private key to read the message."
  s32: "That's the main idea. Only the private key can open a box locked with the public key pair."
  s33: "I use Browserbird public key to send them another message."
  s34: "This is great not only for privacy, but also for identification since we know for sure that only the owner of the 2 keys can open the message."
  s35: "Next, we'll be looking at how symmetric and asymmetric keys play a role when we connect to a site with SSL."
  next: "Next on HowHTTPS.works..."
  next_teaser: "Hurray for encryption! What's next? Learn the secret handshake between your browser and the internet that makes your information safe and secured."

ep3:
  s1: "The Handshake"
  s2: "When you started reading this comic, your browser displayed a lock on the address bar."
  s3: "How did that happen?"
  s4: "Your browser communicated with our server, where this comic is hosted, and they both established a secure connection to transmit messages."
  s5: "But first, they needed to agree on how to communicate securely."
  s6: "If the negotiation is not successful, your browser lets you know by showing an error or warning."
  s7: "If an agreement is reached, your browser is happy to display a padlock on the address bar."
  s8: "This process, the negotiation between a browser and a server, is called 'the handshake'."
  s9: "It happens very fast. We are going to show you how it works."
  s10: "Browserbird will be your browser."
  s11: "Compugter will be our server."
  s12: "Take it away guys!"
  s13: "Ready? Here is what the 'handshake' in slow-motion looks like."
  s14: "Left clap"
  s15: "Right clap"
  s16: "Vertical shaka"
  s17: "Shaka horizontal rotation"
  s18: "Tickles"
  s19: "Done!"
  s20: "Let's do it again, but faster."
  s21: "Left clap - Right clap - Shaka - Shaka rotation - Tickles."
  s22: "A-G-A-I-N !"
  s23: "Stop!"
  s24: "Let's break it down. Step by step."
  s25: "Step One: Left clap. AKA Client Hello."
  s26: "I send a list of SSL/TLS versions and encryption algorithms that I can work with to Compugter. Nowadays, I prefer TLS 1.3, so I send a key_share as well."
  s27: "A fancy word for the encryption algorithm list is 'cipher suite'."
  s28: "So you can sound like a pro at the dinner table."
  s29: "The SSL and TLS protocols have evolved over time, we'll talk more about that soonish."
  s30: "And then I wait for an answer from Compugter."
  s31: "Step two: Right clap. AKA Server Hello."
  s32: "I choose TLS 1.3 and a cipher suite. I also returns my key_share. From here, TLS 1.3 encrypts the rest of the handshake."
  s33: "Immediately after I send my certificate, which includes my public key, so they can verify who I am."
  s34: "Step three: Vertical shaka. AKA Key Share."
  s35: "I check Compugter's certificate to make sure they are legit."
  s36: "Since we both sent a key share previously, we can both derive the same secret, unlocking secrecy."
  s37: "### This frame has been removed. Do not translate."
  s38: "Step four: Shaka horizontal rotation. AKA Finished Messages."
  s39: "From ServerHello onward (step two), the handshake is encrypted."
  s40: "They exchange Finished messages to prove they derived the same secret — and boom, session keys are ready in one round-trip."
  s41: "### This frame has been removed. Do not translate."
  s42: "### This frame has been removed. Do not translate."
  s43: "### This frame has been removed. Do not translate."
  s44: "### This frame has been removed. Do not translate."
  s45: "Step five: Tickles. AKA Everything is now secured."
  s46: "Now all data going back and forth between Browserbird and Compugter is now secured for the rest of the session."
  s47: "Passwords, credit card details, everything."
  s48: "Simple, right?"
  s49: "Next time you connect to a website securely via HTTPS, give your browser the shaka because you know their secret handshake."
  next: "Next on HowHTTPS.works..."
  next_teaser: "HTTPS, SSL, TLS, oh my! I just had an acronym soup for lunch. What do they mean? Are they the same thing?"

ep4:
  s1: "The differences between HTTPS, SSL, and TLS"
  s2: "It's easy to confuse these terms and use them interchangeably."
  s3: "Let's look into each one and see how they differ."
  s4: "What's HTTPS?"
  s5: "HTTPS is the secured version of HTTP: HyperText Transfer Protocol."
  s6: "HTTP is the protocol used by your browser and web servers to communicate and exchange information."
  s7: "When that exchange of data is encrypted with SSL/TLS, then we call it HTTPS. The 'S' stands for Secure."
  s8: "OMG! Wait! Did I say SSL/TLS! Why?"
  s9: "Because it's the precise way to talk about SSL and TLS."
  s10: "SSL stands for 'Secure Sockets Layer'. A protocol created by Netscape."
  s11: "SSL is a dinosaur by Internet standards. The first version was never released and version 2 launched with the browser Netscape 1.1 in 1995."
  s12: "Later that year Netscape released version 3 because version 2 had some major security problems."
  s13: "We were all happy cats until 1999. Browser wars between Netscape and Microsoft, the need for standards, and Britney Spears - '...Baby One More Time' changed the world as we know it. Fur-ever."
  s14: "Oops, I did it again."
  s15: "Netscape gave control of SSL protocol to the IETF: Internet Engineering Task Force."
  s16: "Before 1999 ended, IETF released TLS version 1.0 (Which was really SSL 3.1)."
  s17: "SSL was renamed to TLS: Transport Layer Security. Creating confusion and chaos still to this day."
  s18: "Thanks 1999."
  s19: "TLS 1.0 took off and version 1.1 was released in 2006."
  s20: "A couple of years later, in 2008, TLS 1.2 was released to address a few flaws and exploits."
  s21: "However, it's not until 2013 that browsers start to catch up and add support for TLS 1.2."
  s22: "To add to the confusion, SSL 3.0 was officially deprecated in 2015."
  s23-1: "TLS 1.3 was standardized in August 2018 and is supported in all current major browsers."
  s23-2: "Click here to check the current TLS version for your browser."
  s23-3: "But come back to finish the story."
  s24: "TLS 1.3 brings great security improvements and removes old weaker features."
  s25: "Current browsers use TLS 1.3 by default. It's faster, simpler, and more secure, with TLS 1.2 as a fallback for legacy clients. Older versions have been deprecated in browsers since 2020."
  s26: "Let's recap."
  s27: "HTTPS is just the HTTP protocol but with data encryption using SSL/TLS."
  s28: "SSL is the original and now deprecated protocol created at Netscape in the mid 90s."
  s29: "TLS is the new protocol for secured encryption on the web maintained by IETF."
  s30: "And now you know the hiss-tory."
  next: "Next on HowHTTPS.works..."
  next_teaser: "Certificates and Certificate authorities: What Do They Know? Do They Know Things?? Let's Find Out!"

ep5:
  s1: "Certificate Authorities"
  s2: "A certificate authority (CA) is a third-party organization with 3 main objectives:"
  s3: "1. Issuing certificates."
  s4: "2. Confirming the identity of the certificate owner."
  s5: "3. Providing proof that the certificate is valid."
  s6: "You might have heard of Symantec, Comodo, or Let's Encrypt, among others."
  s7: "Becoming a CA is an intense task of security requirements and audits."
  s8: "You need to be trusted to be accepted into a root store."
  s9: "A root store is basically a database of trusted CAs."
  s10: "Apple, Windows, and Mozilla run their own root stores that they pre-install in your computer or device."
  s11: "Which certificate should you buy? You have basically 3 flavors."
  s12: "Domain validated. The certificate just verifies the domain name, and nothing else. You probably need this one."
  s13: "Organization validated. The certificate requires the validation and manual verification of the organization behind the certificate."
  s14: "Extended validation. The certificate requires an exhaustive verification of the business."
  s15: "All valid certificates result in the browser displaying a secure badge in the browser bar. EV certificates generally display the company name as well."
  s16: "But how do certificates get validated?"
  s17: "When a CA issues a certificate, they sign the certificate with their root certificate pre-installed in the root store."
  s18: "Most of the time it's an intermediate certificate signed with a root certificate."
  s19: "If a cat-astrophy would occur and the root certificate is compromised, it's easier to revoke the intermediate certificates, since the root certificates are installed on each device."
  s20: "Let's walk through how a certificate is validated. The process is based on a 'chain of trust'."
  s21: "Your browser connects to a site via HTTPS and downloads the certificate."
  s22: "The certificate is not a root certificate."
  s23: "Your browser downloads the certificate that was used to sign the certificate on the site."
  s24: "But this certificate is still not the root certificate."
  s25: "Your browser once more looks up the certificate that signed the intermediate certificate."
  s26: "It's the root certificate! Yay!"
  s27: "The entire certificate chain is trusted, and thus the site certificate is trusted as well."
  s28: "In the event that the last certificate is not a root certificate, and there are no more certificates to download, the chain is untrusted."
  s29: "But why use a certificate authority when you can self-sign your certificates?"
  s30: "A self-signed certificate provides the same level of encryption as one generated by an authority."
  s31: "No crabs can spy on your data."
  s32: "And there is no charge to self-sign your certificates!"
  s33: "Yes, but almost every browser checks that the certificate is issued by a trusted authority."
  s34: "As such visitors are warned that the certificate cannot be trusted."
  s35: "Self-signed certificates can be useful for testing, and intranets, but you should avoid using them on public sites."
  s36: "Self-signed certificates can be forged. Basically, they say 'Trust me, it's me, I promise!'."
  s37: "A trusted certificate says: 'Trust me, an authority verified me'."
  s38: "Talking about trust. Thank you for trusting us through this story."
  s39: "Unfortunately, it is coming to an end."
  s40: "We hope you enjoyed this comic!"
  s41: "See you soon!"
  end-title: "Hey, you did it!"
  end-p1: "You finished the comic! Thanks from the bottom of our cat paws for spending some of your day reading about HTTPS."
  end-p2: "We propose three activities to distract you from the fact that there is not another episode to read."
